  // Fuente más pequeña a zoom bajo, crece con el zoom
  const fontSize = Math.min(13, 8.5 / Math.sqrt(zoomLevel)) + "px";

  gEl.selectAll(".node-label")
    .attr("font-size", fontSize)
    .attr("opacity", function(d) {
      // Nodos completamente aislados: aparecen desde zoom 0.4
      if (d._degree === 0) return zoomLevel >= 0.4 ? 1 : 0;
      return visible.has(d.id) ? 1 : 0;
    });
}

// ── Zoom ──────────────────────────────────────────────────────────────────────
let currentZoom = 1;

const zoomBehavior = d3.zoom().scaleExtent([0.15, 10])
  .on("zoom", function(event) {
    gEl.attr("transform", event.transform);
    currentZoom = event.transform.k;
    updateLabels(currentZoom);
  });

svg.call(zoomBehavior);

// ── Reescalar coordenadas al tamaño del SVG ───────────────────────────────────
// EXPAND: ampliamos el canvas lógico un 40% extra para separar los nodos,
// y luego la vista inicial hace zoom-out para verlo todo.
const SPREAD = 1.4;   // factor de expansión (1 = sin cambio, 1.4 = 40% más separado)

function rescale() {
  const xExt = d3.extent(nodesData, d => d.x);
  const yExt = d3.extent(nodesData, d => d.y);
  const pad = 60;
  const w = (getW() - pad * 2) * SPREAD;
  const h = (getH() - pad * 2) * SPREAD;
  // Centramos el canvas expandido
  const offX = -(w - (getW() - pad * 2)) / 2;
  const offY = -(h - (getH() - pad * 2)) / 2;
  const scX = d3.scaleLinear().domain(xExt).range([pad + offX, pad + offX + w]);
  const scY = d3.scaleLinear().domain(yExt).range([pad + offY, pad + offY + h]);
  nodesData.forEach(function(d) { d.px = scX(d.x); d.py = scY(d.y); });
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  rescale();

  // Aristas
  gEl.selectAll(".edge").remove();
  gEl.selectAll(".edge")
    .data(edgesData)
    .enter().append("line")
    .attr("class", "edge")
    .attr("x1", function(d) { return nodeById.get(d.source).px; })
    .attr("y1", function(d) { return nodeById.get(d.source).py; })
    .attr("x2", function(d) { return nodeById.get(d.target).px; })
    .attr("y2", function(d) { return nodeById.get(d.target).py; })
    .attr("stroke", "#b0b0b0")
    .attr("stroke-width", function(d) { return edgeScale(d.weight); })
    .attr("stroke-opacity", 0.5);

  // Nodos (círculos)
  gEl.selectAll(".node").remove();
  const nodeG = gEl.selectAll(".node")
    .data(nodesData)
    .enter().append("g")
    .attr("class", "node")
    .attr("transform", function(d) { return "translate(" + d.px + "," + d.py + ")"; })
    .style("cursor", "pointer")
    .on("click", onNodeClick)
    .on("mouseover", onNodeHover)
    .on("mouseout",  onNodeOut);

  nodeG.append("circle")
    .attr("r", function(d) { return sizeScale(d.strength); })
    .attr("fill", function(d) { return regionColors[d.region] || defaultColor; })
    .attr("stroke", "white")
    .attr("stroke-width", 1.5);

  // Etiquetas en capa separada (encima de los círculos)
  gEl.selectAll(".node-label").remove();
  gEl.selectAll(".node-label")
    .data(nodesData)
    .enter().append("text")
    .attr("class", "node-label")
    .text(function(d) {
      return d.name.replace(/_/g, " ").replace(/roller derby/gi, "RD");
    })
    .attr("x", function(d) { return d.px; })
    .attr("y", function(d) { return d.py - sizeScale(d.strength) - 3; })
    .attr("text-anchor", "middle")
    .attr("font-size", "9px")
    .attr("fill", "#333")
    .attr("pointer-events", "none");

  // Aplicar visibilidad inicial según zoom actual
  updateLabels(currentZoom);

  buildLegend();
}

// ── Tooltip y selección ───────────────────────────────────────────────────────
const tooltip = d3.select("#tooltip");
let selectedNode = null;

function onNodeClick(event, d) {
  event.stopPropagation();

  if (selectedNode === d.id) {
    clearSelection();
    return;
  }
  selectedNode = d.id;

  const neighbors = new Set(
    edgesData
      .filter(function(e) { return e.source === d.id || e.target === d.id; })
      .flatMap(function(e) { return [e.source, e.target]; })
  );

  gEl.selectAll(".node circle")
    .attr("opacity", function(n) {
      return (neighbors.has(n.id) || n.id === d.id) ? 1 : 0.15;
    });
  gEl.selectAll(".node-label")
    .attr("opacity", function(n) {
      return (neighbors.has(n.id) || n.id === d.id) ? 1 : 0;
    });
  gEl.selectAll(".edge")
    .attr("stroke-opacity", function(e) {
      return (e.source === d.id || e.target === d.id) ? 0.9 : 0.05;
    });

  const rivals = Array.isArray(d.rivals) ? d.rivals : [];
  tooltip
    .style("opacity", 1)
    .html(
      "<h3>" + d.name.replace(/_/g, " ") + "</h3>" +
      "<div class='meta'>" +
        "Región: " + (d.region || "desconocida") + " &nbsp;|&nbsp; " +
        d.degree + " equipos distintos &nbsp;|&nbsp; " +
        d.strength + " partidos" +
      "</div>" +
      "<div class='rivals-title'>Rivales (" + rivals.length + "):</div>" +
      "<ul>" + rivals.map(function(r) { return "<li>" + r + "</li>"; }).join("") + "</ul>"
    );

  positionTooltip(event);
}

function onNodeHover(event, d) {
  if (selectedNode !== null) return;
  tooltip
    .style("opacity", 1)
    .html(
      "<h3>" + d.name.replace(/_/g, " ") + "</h3>" +
      "<div class='meta'>Región: " + (d.region || "desconocida") +
      " &nbsp;|&nbsp; " + d.strength + " partidos</div>"
    );
  positionTooltip(event);
}

function onNodeOut() {
  if (selectedNode !== null) return;
  tooltip.style("opacity", 0);
}

function positionTooltip(event) {
  const tw = 310, th = 220;
  let left = event.clientX + 14;
  let top  = event.clientY - 20;
  if (left + tw > window.innerWidth)  left = event.clientX - tw - 14;
  if (top  + th > window.innerHeight) top  = event.clientY - th;
  tooltip.style("left", left + "px").style("top", top + "px");
}

function clearSelection() {
  selectedNode = null;
  tooltip.style("opacity", 0);
  gEl.selectAll(".node circle").attr("opacity", 1);
  gEl.selectAll(".edge").attr("stroke-opacity", 0.5);
  updateLabels(currentZoom);
}

svg.on("click", clearSelection);

// ── Leyenda ───────────────────────────────────────────────────────────────────
function buildLegend() {
  const leg = d3.select("#legend");
  leg.html("<strong style='font-size:0.8rem;display:block;margin-bottom:5px'>Región</strong>");
  Object.entries(regionColors).forEach(function(entry) {
    const region = entry[0];
    const color  = entry[1];
    const item = leg.append("div").attr("class", "item");
    item.append("div").attr("class", "dot").style("background", color);
    item.append("span").text(region);
  });
  leg.append("div")
    .style("margin-top", "8px")
    .style("font-size", "0.72rem")
    .style("color", "#888")
    .text("Tamaño = nº de partidos");
}

// ── Init ──────────────────────────────────────────────────────────────────────
computeDegrees();

window.addEventListener("resize", function() {
  render();
  updateLabels(currentZoom);
});

// Al cargar: render y luego zoom-to-fit para que todo quepa en pantalla
requestAnimationFrame(function() {
  render();

  // Calcular bbox de todos los nodos y hacer fit
  const xs = nodesData.map(d => d.px);
  const ys = nodesData.map(d => d.py);
  const x0 = d3.min(xs), x1 = d3.max(xs);
  const y0 = d3.min(ys), y1 = d3.max(ys);
  const bw = x1 - x0, bh = y1 - y0;
  const W = getW(), H = getH();
  const fitPad = 60;
  const k = Math.min((W - fitPad * 2) / bw, (H - fitPad * 2) / bh, 1);
  const tx = (W - k * (x0 + x1)) / 2;
  const ty = (H - k * (y0 + y1)) / 2;
  const t = d3.zoomIdentity.translate(tx, ty).scale(k);

  svg.call(zoomBehavior.transform, t);
  currentZoom = k;
  updateLabels(currentZoom);
});
</script>
</body>
</html>
